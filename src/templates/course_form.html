{{define "course_form"}}
<h1>New Course</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/instructor/courses/new">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>Course name <input type="text" name="name"></label>
  <label>Grading method
    <select name="grading_method">
      <option value="zero_to_q2_10">0 = 0, ≥Q2 = 10</option>
      <option value="zero_to_q3_10">0 = 0, ≥Q3 = 10</option>
      <option value="zero_to_q4_10">0 = 0, Q4 = 10</option>
      <option value="q2_5_to_q3_10">Q2 = 5, ≥Q3 = 10</option>
      <option value="q2_5_to_q4_10">Q2 = 5, Q4 = 10</option>
      <option value="q1_5_to_q2_10">Q1 = 5, ≥Q2 = 10</option>
      <option value="q1_5_to_q3_10">Q1 = 5, ≥Q3 = 10</option>
      <option value="q1_5_to_q4_10">Q1 = 5, Q4 = 10</option>
    </select>
  </label>
  <button type="submit">Create</button>
</form>
{{end}}
