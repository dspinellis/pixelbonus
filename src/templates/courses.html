{{define "courses"}}
<h1>Courses</h1>
<p><a class="button" href="/instructor/courses/new">Add a new course</a></p>
<table>
  <tr><th>Course</th><th>Actions</th></tr>
  {{range .Courses}}
  <tr>
    <td>{{.Name}}</td>
    <td>
      <a href="/instructor/courses/{{.ID}}/coupons/new">Coupons</a>
      <a href="/instructor/courses/{{.ID}}/grades">Grades</a>
      <a href="/instructor/courses/{{.ID}}/grades/csv">CSV</a>
      <a href="/courses/{{.ID}}/redemptions">Public</a>
      <a href="/instructor/courses/{{.ID}}/settings">Settings</a>
    </td>
  </tr>
  {{end}}
</table>
{{end}}
