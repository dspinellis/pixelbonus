{{define "layout"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelBonus</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">PixelBonus</a>
    <nav class="topnav">
      <a href="/lang/en">English</a>
      <a href="/lang/el">Greek</a>
      {{if .User}}
      <span>{{.User.FullName}}</span>
      <a href="/instructor/profile">Profile</a>
      <form method="post" action="/instructor/logout" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button type="submit">Log out</button>
      </form>
      {{end}}
    </nav>
  </header>
  <main class="content">
    {{.Body}}
  </main>
  <footer class="footer">
    <a href="https://github.com/dspinellis/pixelbonus" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="/privacy">Privacy Policy</a>
  </footer>
</body>
</html>
{{end}}
