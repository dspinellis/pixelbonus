# Installed as /etc/pixelbonus.conf; readable by the pixelbonus service user.
port=443
log_dir=/var/log/pixelbonus
template_dir=src/templates
base_url=https://www.pixelbonus.com
# Policy URLs keyed by language ID; use external URLs for separately hosted policies.
privacy_policy_urls.en=/privacy
privacy_policy_urls.el=/privacy
db_dsn=pixelbonus:CHANGE_ME@tcp(127.0.0.1:3306)/pixelbonus
